{% extends "admin/base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:75vh;">
  <div class="card shadow-sm" style="width:100%;max-width:420px;">
    <div class="card-body p-4">
      <h5 class="fw-semibold mb-1">Set New Password</h5>
      <p class="text-muted small mb-4">Choose a strong password (min. 8 characters).</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="mb-3">
          <label class="form-label small fw-medium">New Password</label>
          <input type="password" name="password" class="form-control"
                 required autocomplete="new-password" minlength="8">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-medium">Confirm Password</label>
          <input type="password" name="confirm" class="form-control"
                 required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary w-100">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
