{% extends "admin/base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:75vh;">
  <div class="card shadow-sm" style="width:100%;max-width:420px;">
    <div class="card-body p-4">
      <h5 class="fw-semibold mb-1">Enter Reset Code</h5>
      <p class="text-muted small mb-4">Sent to <strong>{{ email }}</strong></p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="mb-3">
          <input type="text" name="otp" class="form-control form-control-lg text-center"
                 maxlength="6" pattern="\d{6}" placeholder="------"
                 autocomplete="one-time-code" inputmode="numeric"
                 required autofocus
                 style="letter-spacing:12px;font-size:1.8rem;font-weight:600;">
        </div>
        <button type="submit" class="btn btn-success w-100 mb-3">Verify Code</button>
      </form>
      <div class="text-center">
        <a href="{{ url_for('auth.forgot_password') }}" class="text-muted small">
          Resend code
        </a>
      </div>
      <p class="text-center text-muted small mt-2 mb-0">Code expires in 10 minutes</p>
    </div>
  </div>
</div>
{% endblock %}
