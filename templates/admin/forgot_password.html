{% extends "admin/base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:75vh;">
  <div class="card shadow-sm" style="width:100%;max-width:420px;">
    <div class="card-body p-4">
      <h5 class="fw-semibold mb-1">Reset Password</h5>
      <p class="text-muted small mb-4">Enter your admin email to receive a reset code.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="mb-3">
          <label class="form-label small fw-medium">Email</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Reset Code</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" class="text-muted small">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
